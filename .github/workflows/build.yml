name: Build CIOS ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y xorriso build-essential

      - name: Build ISO
        run: make iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: cios-iso
          path: cios.iso
