[package]
name = "cios-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
limine = "0.6"
x86_64 = "0.15"
pic8259 = "0.11"
pc-keyboard = "0.9"
lazy_static = { version = "1.5", default-features = false, features = ["spin_no_std"] }
spin = "0.9"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 2
